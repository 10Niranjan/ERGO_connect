name: Deploy (staging)

# Manual only. Nothing deploys on push until a first deploy has proven this pipeline: it has never run against Azure
# or on GitHub (ARCHITECTURE.md §8, Phase 8l). One-time Azure/GitHub setup is in infra/README.md ("CI deploy setup") -
# create the protected `staging` environment BEFORE the Azure trust, not after.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Gate: the same build, test, lint and CVE jobs every push runs. A missing NVD_API_KEY fails here (ci.yml).
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  # Deliberately holds NO cloud credentials. It runs the project's dependency install, a third-party scanner and
  # (in the docker build) arbitrary build scripts; only the tarballs it produces cross into the credentialed job,
  # bound to it by checksum.
  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_sha256: ${{ steps.hash.outputs.backend }}
      frontend_sha256: ${{ steps.hash.outputs.frontend }}
    env:
      # Trivy by digest, not by tag or GitHub Action: in March 2026 its Action had 76 of 77 version tags force-pushed
      # to credential-stealing code, and releases 0.69.4-0.69.6 were malicious. This is 0.74.0. Dependabot cannot
      # update this line: bump it by hand.
      TRIVY: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      # The sidecar infra/main.bicep runs beside the backend; every rollout re-pulls this tag, so scan what it resolves to.
      CLAMAV_IMAGE: clamav/clamav:1.4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build images
        run: |
          mkdir images
          docker build -t ergo-backend:ci ergo-connect-backend
          docker build -t ergo-frontend:ci ergo-connect-frontend
          docker save ergo-backend:ci -o images/backend.tar
          docker save ergo-frontend:ci -o images/frontend.tar
          docker pull "$CLAMAV_IMAGE"
          docker save "$CLAMAV_IMAGE" -o images/clamav.tar

      # OS packages only: Dependency-Check in ci.yml covers the Java dependencies, and Trivy's Java DB download alone
      # took ~5 minutes. Fixable HIGH/CRITICAL fails the build, so a vulnerable image is never pushed. Not covered:
      # anything a build-time dependency bakes into its own image.
      - name: Scan images
        run: |
          for img in backend frontend clamav; do
            docker run --rm -v "$PWD/images:/scan:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" \
              image --input "/scan/$img.tar" --scanners vuln --pkg-types os --severity HIGH,CRITICAL \
              --ignore-unfixed --no-progress --skip-version-check --timeout 15m --exit-code 1
          done

      # The deploy job pushes only tarballs matching these. Without this, any job in the run that can reach the
      # Actions runtime token could replace the `images` artifact while the deploy job waits for approval.
      - name: Record checksums
        id: hash
        run: |
          echo "backend=$(sha256sum images/backend.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(sha256sum images/frontend.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          # ClamAV is scanned only; it is not pushed (it is pulled from its own registry by the Container App).
          path: |
            images/backend.tar
            images/frontend.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The protection that matters lives on this environment (required reviewers, no self-review, no admin bypass,
    # one protected deployment branch) and in the Azure federated credential scoped to it - infra/README.md.
    # Nothing in this file enforces it: the Azure IDs below are identifiers, not secrets.
    environment: staging
    permissions:
      id-token: write
      contents: read
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.ACR_NAME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: images

      - name: Verify images are the ones the build job produced
        env:
          BACKEND_SHA256: ${{ needs.build.outputs.backend_sha256 }}
          FRONTEND_SHA256: ${{ needs.build.outputs.frontend_sha256 }}
        run: |
          printf '%s  images/backend.tar\n%s  images/frontend.tar\n' "$BACKEND_SHA256" "$FRONTEND_SHA256" | sha256sum -c -

      - name: Check configuration
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          for v in RG ACR CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ -z "$missing" ] || { echo "::error::Not configured in the 'staging' environment:$missing (see infra/README.md, CI deploy setup)"; exit 1; }

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push images
        id: push
        run: |
          az acr login --name "$ACR"
          server="$(az acr show --name "$ACR" --query loginServer -o tsv)"
          for img in backend frontend; do
            docker load -i "images/$img.tar"
            docker tag "ergo-$img:ci" "$server/ergo-$img:$GITHUB_SHA"
            docker push "$server/ergo-$img:$GITHUB_SHA"
            # Deploy the exact pushed bytes by digest, not by a tag that could be moved afterwards.
            ref="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$server/ergo-$img:$GITHUB_SHA" | grep -F "$server/ergo-$img@sha256:" | head -n 1)"
            [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::no registry digest for $img after push"; exit 1; }
            echo "${img}_ref=$ref" >> "$GITHUB_OUTPUT"
          done

      - name: Roll out
        env:
          BACKEND_REF: ${{ steps.push.outputs.backend_ref }}
          FRONTEND_REF: ${{ steps.push.outputs.frontend_ref }}
        run: |
          {
            echo "### Images pushed (roll back with \`az containerapp update --container-name <app> --image <previous digest>\`)"
            echo "- backend: \`$BACKEND_REF\`"
            echo "- frontend: \`$FRONTEND_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # The apps are created by infra/main.bicep (phase 2), which needs secrets this pipeline does not hold.
          if ! az containerapp show --name backend --resource-group "$RG" --output none 2>/dev/null; then
            echo "::error::The Container Apps do not exist yet. The images are pushed; run infra phase 2 with BACKEND_IMAGE=$BACKEND_REF FRONTEND_IMAGE=$FRONTEND_REF exported (infra/README.md), then re-run this workflow."
            exit 1
          fi

          # `update` returning does not prove the new revision is serving: in single-revision mode the old one keeps
          # traffic until the new one is ready, and a revision that never becomes ready must not read as success.
          roll() {
            local app="$1" ref="$2" latest ready image
            az containerapp update --name "$app" --resource-group "$RG" --container-name "$app" --image "$ref" --output none
            for _ in $(seq 1 40); do
              read -r latest ready image < <(az containerapp show --name "$app" --resource-group "$RG" \
                --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.template.containers[?name=='$app'].image | [0]]" -o tsv)
              if [ "$latest" = "$ready" ] && [ "$image" = "$ref" ]; then echo "$app is serving $ref"; return 0; fi
              sleep 15
            done
            echo "::error::$app never became ready on $ref (latest=$latest ready=$ready)"
            return 1
          }
          roll backend "$BACKEND_REF"
          roll frontend "$FRONTEND_REF"

      - name: Smoke test
        run: |
          fqdn="$(az containerapp show --name frontend --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          bash .github/scripts/smoke.sh "https://$fqdn"

      # Revision state only: backend console logs hold user emails and IPs and must not be copied into Actions logs.
      # Application logs are in the environment's Log Analytics workspace.
      - name: Diagnostics
        if: failure()
        run: |
          for app in backend frontend; do
            az containerapp revision list --name "$app" --resource-group "$RG" --output table || true
          done
