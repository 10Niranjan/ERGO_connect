name: Demo images

# Builds the backend and frontend images for the Oracle VMs (deploy/: the client demo AND production,
# docker-compose.oracle.yml) and pushes them to GHCR, so the VMs only pull them. Not the Azure path (deploy.yml).
# Images: ghcr.io/<owner>/ergo-connect-{backend,frontend}:<commit sha> (plus :demo). Only built after ci.yml (tests,
# lint, Dependency-Check) passes for the same commit. The packages stay PRIVATE: VMs `docker login ghcr.io` with a
# read:packages token. Production pins IMAGE_TAG to a sha whose run here is fully green.
on:
  workflow_dispatch:
  # A workflow_dispatch can only be started once the file is on the default branch, so also run on pushes to the demo branch.
  push:
    branches: [sprint-5-demo]
    paths:
      - ergo-connect-backend/**
      - ergo-connect-frontend/**
      - .github/workflows/demo-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-images
  cancel-in-progress: true

jobs:
  # Gate: the same build, test, lint and CVE jobs as every push (as deploy.yml does).
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      require_cve_gate: true # no NVD_API_KEY = no images
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ergo-connect-backend
          - name: frontend
            context: ergo-connect-frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR repository names must be lowercase.
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ergo-connect-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:demo
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
