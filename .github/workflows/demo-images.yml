name: Demo images

# Builds the backend and frontend images for the one-small-VM client demo (deploy/) and pushes them to GHCR, so the
# VM only pulls them (a 1 GB Oracle Micro cannot run the Maven/npm builds). Not the Azure path (deploy.yml).
# Manual only; run it from the sprint-5-demo branch. Images: ghcr.io/<owner>/ergo-connect-{backend,frontend}:demo
# After the first run, set both packages to Public (GitHub > Packages > package settings) so the VM can pull without a token.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ergo-connect-backend
          - name: frontend
            context: ergo-connect-frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR repository names must be lowercase.
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ergo-connect-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:demo
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
