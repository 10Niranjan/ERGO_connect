name: CI

on:
  push:
  pull_request:
  # deploy.yml gates on this exact workflow rather than re-implementing it (Phase 8l)
  workflow_call:
    secrets:
      NVD_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ergo-connect-backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker for a real Postgres
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ergo-connect-frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ergo-connect-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Dependency hygiene (ARCHITECTURE.md §4/§8 Phase 8a): fail on high/critical CVEs. npm's own
      # auditor, no extra tool needed for this half - OWASP Dependency-Check below covers the backend.
      - run: npm audit --audit-level=high

  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ergo-connect-backend
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # dependency-check-maven 13 hard-fails with no NVD data at all if this secret is unset (NVD now
      # requires a key, no anonymous fallback) - skip gracefully rather than blocking every push/PR on a
      # one-time setup step. Request a free key at https://nvd.nist.gov/developers/request-an-api-key
      # and add it as the repo secret NVD_API_KEY to turn this gate on (ARCHITECTURE.md §8, Phase 8a).
      # Skipping is fine for a push/PR, but not for a deploy (called from deploy.yml, where github.event_name is
      # the caller's workflow_dispatch): a green deploy run must mean the Java CVE gate really ran (Phase 8l).
      - if: env.NVD_API_KEY == '' && github.event_name == 'workflow_dispatch'
        run: |
          echo "::error::NVD_API_KEY is not set, so the backend CVE gate cannot run - refusing to let a deploy through without it."
          exit 1
      - if: env.NVD_API_KEY == '' && github.event_name != 'workflow_dispatch'
        run: echo "::warning::NVD_API_KEY repo secret is not set - skipping the CVE gate for this run. See the comment on this step in .github/workflows/ci.yml."
      - if: env.NVD_API_KEY != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - if: env.NVD_API_KEY != ''
        run: ./mvnw -B -Psecurity dependency-check:check -DnvdApiKey="$NVD_API_KEY"
      - if: always() && env.NVD_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: ergo-connect-backend/target/dependency-check-report.html
          if-no-files-found: ignore
