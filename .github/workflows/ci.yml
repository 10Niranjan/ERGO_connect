name: CI

on:
  push:
  pull_request:
  # deploy.yml gates on this exact workflow rather than re-implementing it (Phase 8l)
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ergo-connect-backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker for a real Postgres
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ergo-connect-frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ergo-connect-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Dependency hygiene (ARCHITECTURE.md §4/§8 Phase 8a): fail on high/critical CVEs. npm's own
      # auditor, no extra tool needed for this half - the Trivy job below covers the backend.
      - run: npm audit --audit-level=high

  # Backend dependency CVE gate (ARCHITECTURE.md §8, Phase 8a; Trivy since 2026-11-06). OWASP Dependency-Check needed
  # an NVD API key as a repo secret, which nobody with admin could add, so no image was ever built. Trivy needs no key:
  # it resolves the Maven tree from pom.xml and fails on fixable HIGH/CRITICAL. It always runs, on every push/PR/deploy.
  # Same digest-pinned image as deploy.yml (not the GitHub Action: its tags were hijacked in March 2026).
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # 0.74.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Resolve the dependency tree into the runner's Maven repo first and let Trivy read it from there: left alone it
      # fetches every POM from Maven Central during the scan and gets 429-throttled (30 min Retry-After) on shared IPs.
      - name: Resolve backend dependencies
        working-directory: ergo-connect-backend
        run: ./mvnw -B -q dependency:go-offline
      - name: Scan backend dependencies
        run: |
          test -f ergo-connect-backend/pom.xml || { echo "::error::ergo-connect-backend/pom.xml missing: nothing to scan"; exit 1; }
          docker run --rm -v "$PWD/ergo-connect-backend:/src:ro" -v "$HOME/.m2/repository:/root/.m2/repository:ro" "$TRIVY" \
            fs /src --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --no-progress --skip-version-check --timeout 15m --exit-code 1
