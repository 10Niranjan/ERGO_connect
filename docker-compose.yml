# Full local stack from the built images, for smoke-testing a container build end to end.
# Not a deployment manifest — 8k provisions the real Azure infra. Backend runs the dev profile
# (Postgres-backed DocumentStorage, no Azure/mail secrets needed) against these same sidecars.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ergo_connect
      POSTGRES_USER: ergo
      POSTGRES_PASSWORD: ergo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergo -d ergo_connect"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
  clamav:
    image: clamav/clamav:1.4
    # Same settings as docker/docker-compose.local.yml - without them clamd's own 25MB
    # stream cap and default scan behaviour silently pass encrypted/nested/macro payloads
    # (the 8i H1 gap) instead of flagging them (security-reviewer M2).
    environment:
      CLAMD_CONF_StreamMaxLength: 60M
      CLAMD_CONF_MaxScanTime: 5000
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_AlertEncryptedDoc: "yes"
      CLAMD_CONF_AlertOLE2Macros: "yes"
      CLAMAV_NO_FRESHCLAMD: "true"

  backend:
    build: ./ergo-connect-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ergo_connect
      SPRING_DATA_REDIS_HOST: redis
      CLAMAV_HOST: clamav
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      clamav: { condition: service_started }

  frontend:
    build: ./ergo-connect-frontend
    ports: ["127.0.0.1:8081:8080"]
    depends_on: [backend]
