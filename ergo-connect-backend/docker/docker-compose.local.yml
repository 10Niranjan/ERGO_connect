# Local dev dependencies. Run: docker compose -f docker/docker-compose.local.yml up -d
# Kafka intentionally absent — deferred out of MVP (ARCHITECTURE.md §6).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ergo_connect
      POSTGRES_USER: ergo
      POSTGRES_PASSWORD: ergo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergo -d ergo_connect"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  # Virus scanning (Phase 8i). Pinned, non-base tag: ships with signature databases already loaded, so there's
  # no freshclam download on first start. StreamMaxLength raised above this app's own 50MB upload cap, so a
  # legitimate near-cap file is never rejected by clamd's own limit before malware scanning even runs.
  # security-reviewer H1: with clamd's defaults, a password-protected/encrypted archive, a zip nested many
  # layers deep, or one that blows past its own scan-time budget all come back "stream: OK" even when they
  # contain a known-bad payload, scan time included - not actually scanned, but never flagged either. The
  # Alert* settings turn each of those into an explicit FOUND instead of a silent pass; MaxScanTime must stay
  # below ClamAvVirusScanner's own read timeout (ergo.clamav.timeout-ms, 10s) so clamd always answers with an
  # error before the client gives up. AlertEncryptedDoc/AlertOLE2Macros (client decision) also flag encrypted
  # PDFs and macro-enabled Office files outright - stricter than scanning their content alone, chosen because
  # macro-enabled documents are a common malware vector for a B2B platform strangers upload files to.
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 60M
      CLAMD_CONF_MaxScanTime: 5000
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_AlertEncryptedDoc: "yes"
      CLAMD_CONF_AlertOLE2Macros: "yes"
      CLAMAV_NO_FRESHCLAMD: "true"
    ports: ["3310:3310"]

volumes:
  pgdata:
