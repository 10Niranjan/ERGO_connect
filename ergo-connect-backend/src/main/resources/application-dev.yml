# Local only — matches docker/docker-compose.local.yml. Never reuse these credentials elsewhere.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ergo_connect
    username: ergo
    password: ergo

ergo:
  security:
    jwt-secret: dev-only-jwt-secret-never-use-outside-local-dev
    skip-otp: true # dev only: no 2FA code prompt on login
  communication:
    # Prod runs this once a day at 06:00. In dev it runs every 5 minutes (reminders are deduplicated per day), so a
    # freshly seeded demo database shows overdue reminders without waiting for the morning.
    overdue-cron: "0 */5 * * * *"
