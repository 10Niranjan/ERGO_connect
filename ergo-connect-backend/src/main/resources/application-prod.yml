# All secrets come from the environment (Azure Key Vault in deployment) — never commit values here.
server:
  # Azure terminates TLS at the proxy and forwards plain HTTP; without this, request.isSecure() is
  # always false behind it, so Spring Security's HSTS header writer would never fire (ARCHITECTURE.md §8, Phase 8c).
  # "native" (Tomcat's RemoteIpValve), not "framework": the valve only honours X-Forwarded-* from peers
  # in server.tomcat.remoteip.internal-proxies (private ranges by default) and strips a client-supplied
  # value, so getRemoteAddr() - which audit_logs and the session store both record - can't be spoofed by
  # an external caller. "framework" has no trusted-proxy concept at all and would let any caller fake
  # their IP in the audit trail. Revisit server.tomcat.remoteip.internal-proxies in 8k once the real
  # Azure ingress topology (and whether Front Door/App Gateway sits in front) is known.
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      # rediss:// (TLS), not redis:// - Azure Cache for Redis disables the plaintext 6379 port by default,
      # so a redis:// URL fails every connection and silently disables the rate limiter (fail-open). Format:
      # rediss://:<access-key>@<name>.redis.cache.windows.net:6380 (Phase 8k provisions the actual instance).
      url: ${REDIS_URL}
  mail:
    # Required: without this, no MailSender bean exists and RequireMailInProd refuses to start the app
    # (Phase 8f security review) - a prod deployment must never fall back to logging live reset links.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # required, not just offered (Phase 8f security review) - "enable" alone lets a network attacker
            # strip STARTTLS and force plaintext, exposing SMTP credentials and live reset tokens in transit
            required: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ergo:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend-base-url: ${FRONTEND_BASE_URL}
  mail:
    from: ${MAIL_FROM}
  security:
    jwt-secret: ${JWT_SECRET} # at least 32 random bytes; the app refuses to start without it
  storage:
    azure:
      # Secret (Key Vault) - the app refuses to start without it (AzureBlobDocumentStorage, Phase 8h).
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
      container: ${AZURE_STORAGE_CONTAINER:documents}
