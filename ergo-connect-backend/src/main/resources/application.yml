spring:
  application:
    name: ergo-connect
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error bodies, no stack traces

management:
  endpoints:
    web:
      exposure:
        include: health,info

ergo:
  cors:
    # Explicit allow-list, never "*" (ARCHITECTURE.md §4)
    allowed-origins: http://localhost:5173
