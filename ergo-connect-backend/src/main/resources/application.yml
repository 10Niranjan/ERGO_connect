spring:
  application:
    name: ergo-connect
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error bodies, no stack traces
  servlet:
    multipart:
      max-file-size: 50MB # drawings and 3D models; files are held in memory while stored
      max-request-size: 51MB
  data:
    redis:
      # Short on purpose (Phase 8d, ARCHITECTURE.md §8): Lettuce's 60s default would otherwise stall every
      # login attempt for a minute during a Redis outage before LoginRateLimiter's fail-open catch runs.
      timeout: 250ms
      connect-timeout: 250ms
      repositories:
        enabled: false # only RedisTemplate is used directly - no @RedisHash entities to scan for

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # The login rate limiter is a resilience add-on, not a core dependency: it already fails open on its
      # own, so a Redis outage shouldn't also flip the app's overall health to DOWN (Phase 8d).
      enabled: false

ergo:
  cors:
    # Explicit allow-list, never "*" (ARCHITECTURE.md §4)
    allowed-origins: http://localhost:5173
  security:
    access-token-ttl: 15m # short: role/account changes reach every request within this window
    session-ttl: 12h      # a login lasts one working day at most
