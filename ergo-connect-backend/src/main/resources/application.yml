spring:
  application:
    name: ergo-connect
  datasource:
    hikari:
      data-source-properties:
        # pgjdbc puts the whole failing row ("Failing row contains (<price>, <hidden margin>...)") into constraint-violation
        # messages, and those reach logs and monitoring. ValidationErrorHandler only ever uses the constraint name, which
        # stays in the message's first line. (Phase 8m security review, M3)
        logServerErrorDetail: false
  jackson:
    deserialization:
      accept-float-as-int: false # 1.5 for a whole number is a 400, never a silent 1
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error bodies, no stack traces
  servlet:
    multipart:
      max-file-size: 50MB # drawings and 3D models; files are held in memory while stored
      max-request-size: 51MB
      # Without this (Phase 8d-bis, ARCHITECTURE.md §8), DispatcherServlet parses the multipart body - reading
      # the full 51MB to a temp file - before UploadRateLimitInterceptor's preHandle ever runs, so a caller
      # already past the upload limit still costs full bandwidth/disk per blocked request. Lazy resolution
      # defers parsing until a controller actually binds a MultipartFile, which happens after preHandle; Tomcat
      # also caps an unread body to server.tomcat.max-swallow-size (2MB default) before closing the connection.
      resolve-lazily: true
  data:
    redis:
      # Short on purpose (Phase 8d, ARCHITECTURE.md §8): Lettuce's 60s default would otherwise stall every
      # login attempt for a minute during a Redis outage before LoginRateLimiter's fail-open catch runs.
      timeout: 250ms
      connect-timeout: 250ms
      repositories:
        enabled: false # only RedisTemplate is used directly - no @RedisHash entities to scan for
  mail:
    properties:
      mail:
        smtp:
          # Jakarta Mail's own defaults are unbounded (Phase 8f security review) - a stalled relay would
          # otherwise hold a request thread and a Hikari connection open indefinitely.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  task:
    scheduling:
      pool:
        size: 3 # the access-policy refresh must not queue behind the daily jobs
    execution:
      mode: force # AsyncConfig's passwordResetExecutor is the only Executor bean today - force keeps it that
                  # way rather than letting it silently satisfy Boot's own unrelated applicationTaskExecutor too

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # The login rate limiter is a resilience add-on, not a core dependency: it already fails open on its
      # own, so a Redis outage shouldn't also flip the app's overall health to DOWN (Phase 8d).
      enabled: false
    mail:
      # Same reasoning as redis above: a forgot-password email is best-effort (Phase 8f), not something an
      # SMTP outage should flip the whole app's health to DOWN over.
      enabled: false

ergo:
  cors:
    # Explicit allow-list, never "*" (ARCHITECTURE.md §4)
    allowed-origins: http://localhost:5173
  # Where the reset-password link in the email points (Phase 8f, ARCHITECTURE.md §8) - a configured value, not
  # the request's own host/scheme, since the API and the frontend are served from different origins.
  frontend-base-url: http://localhost:5173
  security:
    access-token-ttl: 15m # short: role/account changes reach every request within this window
    session-ttl: 12h      # a login lasts one working day at most
    password-reset-token-ttl: 30m
  # ClamAV sidecar (Phase 8i) - docker/docker-compose.local.yml runs the same image dev points at here; prod
  # overrides the host via CLAMAV_HOST once 8k/8l deploy the real sidecar.
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: 10000
